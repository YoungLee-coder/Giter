name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json
      - src-tauri/tauri.conf.json
      - src-tauri/Cargo.toml

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
      release_body: ${{ steps.notes.outputs.release_body }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version and skip if already released
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Could not read version from src-tauri/tauri.conf.json" >&2
            exit 1
          fi

          PKG_VERSION=$(jq -r '.version' package.json)
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)

          if [ "$VERSION" != "$PKG_VERSION" ] || [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "Version mismatch: tauri.conf=$VERSION package.json=$PKG_VERSION Cargo.toml=$CARGO_VERSION" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists; skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes from CHANGELOG.md
        id: notes
        if: steps.version.outputs.should_release == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md is missing. Add release notes before publishing." >&2
            exit 1
          fi

          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')

          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "No CHANGELOG.md section found for [$VERSION]. Add ## [$VERSION] notes before releasing." >&2
            exit 1
          fi

          {
            echo 'release_body<<EOF'
            echo "## What's Changed"
            echo
            printf '%s\n' "$NOTES"
            echo
            echo "## Downloads"
            echo
            echo "- **macOS Apple Silicon**: \`.dmg\` (aarch64)"
            echo "- **macOS Intel**: \`.dmg\` (x86_64)"
            echo "- **Windows**: NSIS installer (\`.exe\`) and MSI (\`.msi\`)"
            echo
            echo "Unsigned builds: on macOS, right-click the app and choose Open the first time."
            echo EOF
          } >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Giter v__VERSION__
          releaseBody: ${{ needs.check-version.outputs.release_body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
